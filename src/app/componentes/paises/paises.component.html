
<app-header></app-header>

<!-- ENCABEZADO -->
<div class="info-header">
  <div class="info-header-content">
    <div class="info-icon">
      <i class="fa-solid fa-book-open"></i>
    </div>
    <div>
      <h1>Países</h1>
      <p>Selecciona un país para consultar la información.</p>
    </div>
  </div>
</div>

<!-- BANDERAS Y NOMBRES -->
<section class="paises-section">
  <div class="paises-container">
    <div class="pais-item" *ngFor="let pais of paises" (click)="abrirPais(pais.nombre)">
      <img [src]="pais.bandera" [alt]="'Bandera de ' + pais.nombre">
      <span>{{ pais.nombre }}</span>
    </div>
  </div>
</section>

<!-- MODAL DE INFORMACIÓN -->
<div class="modal-fondo" *ngIf="paisSeleccionado" (click)="cerrarPais()">
  <div class="modal-pais" (click)="$event.stopPropagation()">

    <!-- CABECERA -->
    <div class="modal-header">
      <div class="modal-pais-identidad">
        <img
          *ngIf="paisActual?.bandera"
          [src]="paisActual?.bandera"
          [alt]="'Bandera de ' + paisActual?.nombre"
        >
        <div>
          <h2>{{ paisActual?.nombre }}</h2>
          <p>{{ paisActual?.divisa || 'Información de retiros PayPal' }}</p>
        </div>
      </div>

      <button
        type="button"
        class="cerrar-modal"
        aria-label="Cerrar ventana"
        (click)="cerrarPais()"
      >
        &times;
      </button>
    </div>

    <!-- TARJETAS -->
    <div class="modal-grid">
      <section class="info-card" *ngFor="let seccion of paisActual?.secciones">
        <h3>
          <span class="info-card-icon">
            <i [class]="seccion.icono"></i>
          </span>
          {{ seccion.titulo }}
        </h3>

        <p *ngFor="let texto of seccion.textos">{{ texto }}</p>

        <ul *ngIf="seccion.lista?.length">
          <li *ngFor="let elemento of seccion.lista">{{ elemento }}</li>
        </ul>
      </section>
    </div>

  </div>
</div>

<app-footer></app-footer>
